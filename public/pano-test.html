<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pano test</title>
    <link rel="stylesheet" href="/node_modules/@photo-sphere-viewer/core/index.css" />
    <style>
      html, body, #viewer { margin: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <script type="module">
      import { Viewer } from '/node_modules/@photo-sphere-viewer/core/index.module.js'

      const url = '/samples/feature-viewer/spherical-pano/7262%20Panorama.jpg'
      const started = performance.now()
      const viewer = new Viewer({
        container: document.getElementById('viewer'),
        panorama: url,
        navbar: false,
      })

      viewer.addEventListener('ready', () => {
        console.log('READY', performance.now() - started)
      })
      viewer.addEventListener('panorama-loaded', () => {
        console.log('LOADED', performance.now() - started)
      })
      viewer.addEventListener('panorama-error', (e) => {
        console.error('ERROR', e)
      })
    </script>
  </body>
</html>
